<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><link rel="stylesheet" href="tokens.css?v=20261011appshell1" />
  <title>Reset password | My Way</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=20261007authfields1" />
  <script defer src="app-shell.js?v=20261011appshell9"></script>
  <script defer src="reset-password.js?v=20261011reset1"></script>
  <link rel="stylesheet" href="app-shell.css?v=20261011appshell9" />
</head>
<body class="mwe-reset-page" data-page="reset-password">
  <main class="mwe-reset-main">
    <section class="member-auth-card mwe-reset-card" aria-labelledby="reset-title">
      <a class="member-auth-icon" href="/" aria-label="My Way home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></a>
      <h2 id="reset-title">Choose a new password</h2>
      <p data-reset-intro>Use at least 15 characters. A short phrase of a few words works well.</p>
      <form class="member-auth-form" id="reset-password-form" novalidate>
        <p class="member-auth-error" id="reset-error" role="alert" hidden></p>
        <label class="member-auth-field"><span class="member-auth-label">New password</span>
          <span class="mwe-password-wrap"><input type="password" id="reset-new-password" name="newPassword" autocomplete="new-password" minlength="15" maxlength="128" placeholder="At least 15 characters" required /></span>
          <span class="mwe-strength" aria-live="polite"><span class="mwe-strength-bar"><i id="reset-strength-fill"></i></span><small id="reset-strength-label">Too short</small></span>
        </label>
        <label class="member-auth-field"><span class="member-auth-label">Confirm new password</span>
          <span class="mwe-password-wrap"><input type="password" id="reset-confirm-password" name="confirmPassword" autocomplete="new-password" maxlength="128" placeholder="Type it again" required /></span>
        </label>
        <button class="member-auth-submit" type="submit" id="reset-submit"><span>Reset password</span></button>
        <p class="member-auth-hint"><a href="/?login=required">Back to sign in</a></p>
      </form>
      <div class="mwe-reset-done" id="reset-done" hidden>
        <p class="mwe-reset-success" role="status">Your password has been reset. For your security, you've been signed out on all devices.</p>
        <a class="member-auth-submit" href="/?login=required">Sign in</a>
      </div>
    </section>
  </main>
</body>
</html>
