<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><link rel="stylesheet" href="tokens.css?v=20261026ui8" />
  <title>RhemaSphere Store</title>
    <link rel="stylesheet" href="styles.css?v=20261030ui1" />
  <script src="vendor/lucide.js"></script>
  <script defer src="platform-client.js?v=20261026ch1"></script><script src="ministries.js?v=20261026ch1"></script>
  <script defer src="i18n-ui.js?v=20261103bl1"></script><script defer src="app.js?v=20261109w1"></script><script defer src="auth-client.js?v=20261026ch1"></script>
  <script defer src="platform-modules.js?v=20261026ui4"></script>
  <script defer src="store.js?v=20261110v2"></script>
  <script defer src="content-engagements.js?v=20261026ch1"></script>
  <link rel="stylesheet" href="creator-public.css?v=20261026ui8" />
  <script defer src="creator-data.js?v=20261026ch1"></script>
  <script defer src="creator-public.js?v=20261110v1"></script>
<link rel="stylesheet" href="responsive.css?v=20261026ui8" /><script defer src="app-shell.js?v=20261103bl1"></script><link rel="stylesheet" href="app-shell.css?v=20261103mc5" /><link rel="stylesheet" href="shopify-storefront.css?v=20261110v2" /><link rel="stylesheet" href="rs-ui.css?v=20261103bl1" /><link rel="stylesheet" href="rs-hero.css?v=20261031f2"></head>
<body class="module-page" data-page="store">
  <header class="topbar"></header>
  <main>
    <section class="rs-hero module-directory-hero" style="--rs-hero-img:url('assets/demo-marketplace-collection.png')">
      <div class="rs-hero-inner">
        <div class="module-hero-copy">
          <span class="rs-hero-eyebrow"><i data-lucide="shopping-bag"></i> Christian Marketplace</span>
          <h1>Shop Christian Community Stores</h1>
          <p>Books, music, apparel, ministry tools and services from verified churches and Christian creators.</p>
        </div>
        <div class="rs-hero-actions">
          <button class="rs-hero-btn module-creator-action" type="button" data-creator-action data-creator-href="creator-workspace.html#store" disabled aria-disabled="true"><i data-lucide="plus"></i> Add a Product or Service</button>
        </div>
      </div>
    </section>

    <section class="sf-container module-content sf-collection">
      <div class="sf-toolbar site-search-bar">
        <label class="module-search site-search"><i data-lucide="search"></i><input id="store-search" type="search" placeholder="Search products or stores" aria-label="Search products or stores" /></label>
        <div class="module-filter-group">
          <select class="module-select" id="store-type" data-filter-label="Type" aria-label="Offering type"><option value="all">All types</option><option value="products">Products</option><option value="venues">Venue rentals</option><option value="services">Services</option></select>
          <select class="module-select" id="store-category" data-filter-label="Category" aria-label="Category"><option value="all">All categories</option></select>
          <select class="module-select" id="store-seller" data-filter-label="Seller" aria-label="Seller type"><option value="all">All sellers</option><option>Church</option><option>Organization</option><option>Channel</option><option>Podcaster</option><option>Creator</option></select>
        </div>
      </div>
      <div class="sf-results-row">
        <div class="sf-toolbar-end">
          <span class="sf-count" id="store-result-count">0 products</span>
          <label class="sf-sort"><span>Sort by</span><select class="sf-select" id="store-sort" aria-label="Sort products"><option value="featured">Featured</option><option value="price-low">Price, low to high</option><option value="price-high">Price, high to low</option><option value="rating">Best rated</option></select></label>
          <button class="sf-cart-btn" id="cart-trigger" type="button" aria-controls="store-cart-drawer" aria-expanded="false" aria-label="Open cart"><i data-lucide="shopping-bag"></i><span class="sf-cart-count" id="cart-count">0</span></button>
        </div>
      </div>
      <div class="sf-grid" id="store-products-grid"></div>
    </section>
  </main>
  <footer class="platform-footer"></footer>
  <div class="cart-drawer-backdrop" id="cart-drawer-backdrop" hidden></div>
  <aside class="store-cart-drawer" id="store-cart-drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="store-cart-head"><h3><i data-lucide="shopping-cart"></i> Your Cart</h3><button class="drawer-close" id="cart-close" type="button" aria-label="Close cart"><i data-lucide="x"></i></button></div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-summary">
      <div class="cart-total"><span>Total</span><strong id="cart-total">$0.00</strong></div>
      <a class="module-primary-action" id="checkout-button" href="checkout.html"><i data-lucide="lock-keyhole"></i> Secure Checkout</a>
    </div>
  </aside>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
<script src="/rs-modal-close.js?v=20261106e2i" defer></script>
</body>
</html>
