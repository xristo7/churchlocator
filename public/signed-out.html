<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in | RhemaSphere</title>
  <link rel="stylesheet" href="tokens.css?v=20261026ui8" />
  <link rel="stylesheet" href="creator-studio.css?v=20261026ui8" />
  <style>
    body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:transparent; color:var(--rs-text,#0f172a); --cs-muted:var(--rs-muted,#52607a); --cs-indigo:var(--rs-accent,#4f46e5); }
    .signed-out-wrap { padding:16px 16px calc(120px + env(safe-area-inset-bottom)); }
    .cs-upgrade .cs-eyebrow { color:var(--rs-accent,#4f46e5); justify-content:center; }
    .cs-upgrade p { font-size:1rem; }
    .cs-primary { font-size:1rem; text-decoration:none; }
    .cs-card-icon svg { width:24px; height:24px; }
  </style>
<link rel="stylesheet" href="rs-ui.css?v=20261026ui9" /></head>
<body>
  <main class="signed-out-wrap">
    <section class="cs-upgrade" aria-labelledby="so-title">
      <div class="cs-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></div>
      <p class="cs-eyebrow" id="so-eyebrow">Your account</p>
      <h1 id="so-title">Sign in to see this page</h1>
      <p id="so-body">This page shows your own account details. Everything else on RhemaSphere stays open to browse.</p>
      <button class="cs-primary" type="button" id="so-signin">Sign in or create an account</button>
    </section>
  </main>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var copy = {
      messages: ["Messages", "Sign in to see your messages", "Your conversations with churches and members are private, so they appear once you sign in."],
      profile: ["Profile", "Sign in to see your profile", "Your profile and account settings appear once you sign in."],
      security: ["Account security", "Sign in to manage account security", "Password and sign-in settings appear once you sign in."],
      cart: ["Your cart", "Sign in to see your cart", "Browse the store freely. Sign in when you are ready to add items and check out."],
      checkout: ["Checkout", "Sign in to check out", "Sign in to finish your order. You can keep browsing the store without an account."],
      "store-manager": ["Seller dashboard", "Sign in to manage your store", "Your store, products, and orders appear once you sign in."]
    };
    var c = copy[params.get("view")];
    if (c) {
      document.getElementById("so-eyebrow").textContent = c[0];
      document.getElementById("so-title").textContent = c[1];
      document.getElementById("so-body").textContent = c[2];
      document.title = c[0] + " | RhemaSphere";
    }
    var next = params.get("next") || "app.html";
    document.getElementById("so-signin").addEventListener("click", function () {
      try {
        if (window.parent !== window && window.parent.MWE && window.parent.MWE.openMemberLogin) return window.parent.MWE.openMemberLogin(next);
      } catch (e) {}
      if (window.MWE && window.MWE.openMemberLogin) return window.MWE.openMemberLogin(next);
      window.top.location.href = "index.html?login=required&next=" + encodeURIComponent(next);
    });
  })();
  </script>
</body>
</html>
